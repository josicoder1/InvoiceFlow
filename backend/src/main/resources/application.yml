server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: invoiceflow

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/invoiceflow}
    username: ${SPRING_DATASOURCE_USERNAME:invoiceflow}
    password: ${SPRING_DATASOURCE_PASSWORD:invoiceflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Database schema managed entirely by Flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    access-token-expiration-ms: 3600000 # 1 hour
    refresh-token-expiration-ms: 604800000 # 7 days

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

payments:
  chapa:
    secret-key: ${CHAPA_SECRET_KEY:}
    webhook-secret: ${CHAPA_WEBHOOK_SECRET:}
    connect-redirect-url: ${CHAPA_CONNECT_REDIRECT_URL:http://localhost:8080/api/v1/payments/chapa/callback}

# spring-dotenv: look for .env one level up (project root) since IntelliJ runs from backend/
springdotenv:
  directory: ../